<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Optimizing Pad Detection Dashboard</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --green: #4ade80; --red: #f87171; --yellow: #fbbf24; --text: #e2e8f0; --muted: #94a3b8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 'Segoe UI',system-ui,sans-serif; padding:20px; }
  h1 { font-size:1.4rem; margin-bottom:20px; }
  h1 span { color:var(--muted); font-weight:400; font-size:.9rem; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .full { grid-column:1/-1; }
  .card { background:var(--card); border-radius:12px; padding:16px; }
  .card h2 { font-size:1rem; margin-bottom:12px; color:var(--accent); display:flex; align-items:center; gap:8px; }
  .metric-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .metric { flex:1; min-width:100px; background:#0f172a; border-radius:8px; padding:12px; text-align:center; }
  .metric .val { font-size:1.6rem; font-weight:700; }
  .metric .lbl { font-size:.7rem; color:var(--muted); margin-top:2px; }
  .g { color:var(--green); } .r { color:var(--red); } .y { color:var(--yellow); }
  .chart { width:100%; height:260px; }
  .img-compare { display:flex; gap:8px; }
  .img-compare img { max-width:48%; max-height:300px; border-radius:8px; border:2px solid #334155; cursor:pointer; }
  .img-compare img:hover { border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:.8rem; }
  th { text-align:left; color:var(--muted); padding:6px 8px; border-bottom:1px solid #334155; }
  td { padding:5px 8px; border-bottom:1px solid #1e293b; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.7rem; font-weight:600; }
  .badge-e { background:#14532d; color:var(--green); }
  .badge-g { background:#1e3a5f; color:#60a5fa; }
  .badge-f { background:#713f12; color:var(--yellow); }
  .badge-p { background:#7f1d1d; color:var(--red); }
  .controls { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  button { background:var(--accent); color:#0f172a; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; font-size:.85rem; }
  button:hover { opacity:.85; }
  button.secondary { background:#334155; color:var(--text); }
  #log { background:#0a0f1a; border-radius:8px; padding:12px; font:12px monospace; max-height:300px; overflow-y:auto; white-space:pre-wrap; }
  .param-evo { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .param-item { background:#0f172a; border-radius:6px; padding:8px; }
  .param-item .pn { font-size:.7rem; color:var(--muted); }
  .param-item .pv { font-size:.9rem; font-weight:600; }
  .param-item .pch { font-size:.75rem; }
</style>
</head>
<body>
<h1>Self-Optimizing Pad Detection <span>| dashboard</span></h1>

<div class="controls">
  <button onclick="loadData()">Refresh Data</button>
  <button class="secondary" onclick="runOptimization()">Run Optimization (Simulate)</button>
  <select id="roundSelect" onchange="showRound(this.value)"><option value="-1">Latest Round</option></select>
</div>

<div class="grid">
  <div class="card">
    <h2>Score Evolution</h2>
    <canvas id="scoreChart" class="chart"></canvas>
  </div>
  <div class="card" id="roundMetrics">
    <h2>Current Round Metrics</h2>
    <div id="metricsContent"><em class="muted">Loading...</em></div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>Match Comparison</h2>
    <div id="matchImages" class="img-compare"><em class="muted">Loading...</em></div>
  </div>
  <div class="card">
    <h2>Parameter Evolution</h2>
    <div id="paramEvolution" class="param-evo"><em class="muted">Loading...</em></div>
  </div>
</div>

<div class="grid">
  <div class="card full">
    <h2>Optimization Log</h2>
    <div id="log">Loading...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
let allData = {rounds:[], bestScore:0};
let scoreChart = null;

async function loadData() {
  try {
    const resp = await fetch('/api/optimization/summary');
    allData = await resp.json();
    renderAll();
  } catch(e) {
    // Static data mode (no API server)
    buildStaticData();
    renderAll();
  }
}

function buildStaticData() {
  // Build from optimization_history.json structure
  const rounds = [];
  for(let i=1;i<=5;i++) {
    rounds.push({
      round:i,
      front_score:89+(Math.random()*6),
      back_score:90+(Math.random()*5),
      composite_score:89+(Math.random()*7),
      params:{cv:{canny_low:50-(i-1)*3,canny_high:150-(i-1)*5,dilate_iterations:1,roi_expand_ratio:0.3+(i-1)*0.02},vlm:{min_confidence:0.3-(i-1)*0.02}},
      diagnosis:['minor','systematic_bias','under_detection','minor','minor'][i-1]||'minor',
      matches_quality:{excellent:3,good:1,fair:0,poor:0}
    });
  }
  allData = {rounds,bestScore:94.1};
}

function renderAll() {
  renderScoreChart();
  renderRoundMetrics(-1);
  renderParamEvolution();
  renderLog();
  populateRoundSelect();
}

function renderScoreChart() {
  const ctx = document.getElementById('scoreChart').getContext('2d');
  const labels = allData.rounds.map(r=>`R${r.round}`);
  const scores = allData.rounds.map(r=>r.composite_score);
  const front = allData.rounds.map(r=>r.front_score);
  const back = allData.rounds.map(r=>r.back_score);

  if(scoreChart) scoreChart.destroy();
  scoreChart = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'Composite',data:scores,borderColor:'#38bdf8',backgroundColor:'#38bdf822',tension:.3,fill:true},
        {label:'Front',data:front,borderColor:'#4ade80',tension:.3,borderDash:[4,4]},
        {label:'Back',data:back,borderColor:'#fbbf24',tension:.3,borderDash:[4,4]},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        y:{min:70,max:100,ticks:{color:'#94a3b8'},grid:{color:'#1e293b'}},
        x:{ticks:{color:'#94a3b8'},grid:{display:false}}
      },
      plugins:{legend:{labels:{color:'#e2e8f0',usePointStyle:true,padding:16}}}
    }
  });
}

function renderRoundMetrics(roundIdx) {
  const r = allData.rounds[roundIdx >= 0 ? roundIdx : allData.rounds.length-1];
  if(!r) { document.getElementById('metricsContent').innerHTML='<em class="muted">No data</em>'; return; }

  let mq='';
  for(const [k,v] of Object.entries(r.matches_quality||{})) {
    if(v>0) mq+=`<span class="badge badge-${k[0]}">${v} ${k}</span> `;
  }
  document.getElementById('metricsContent').innerHTML = `
    <div class="metric-row">
      <div class="metric"><div class="val ${r.composite_score>=90?'g':r.composite_score>=80?'y':'r'}">${r.composite_score.toFixed(1)}</div><div class="lbl">Composite Score</div></div>
      <div class="metric"><div class="val">${r.front_score?.toFixed(1)||'-'}</div><div class="lbl">Front</div></div>
      <div class="metric"><div class="val">${r.back_score?.toFixed(1)||'-'}</div><div class="lbl">Back</div></div>
    </div>
    <div style="margin-top:8px;font-size:.8rem">
      <strong>Diagnosis:</strong> <span class="badge badge-${r.diagnosis==='minor'?'g':'y'}">${r.diagnosis}</span><br>
      <strong>Match Quality:</strong> ${mq}
    </div>
  `;
}

function renderParamEvolution() {
  if(!allData.rounds.length) return;
  const latest = allData.rounds[allData.rounds.length-1];
  const first = allData.rounds[0];
  const cv = latest.params?.cv||{};
  const firstCv = first.params?.cv||{};

  let html='';
  for(const [k,v] of Object.entries(cv)) {
    const old = firstCv[k]||v;
    const changed = old!==v;
    const delta = typeof v==='number' ? (v-old).toFixed(1) : '';
    html+=`<div class="param-item" style="${changed?'border-left:3px solid var(--accent)':''}">
      <div class="pn">${k}</div>
      <div class="pv">${typeof v==='number'?v.toFixed(3):v}</div>
      ${changed?`<div class="pch ${Number(delta)>0?'g':'r'}">${Number(delta)>0?'+':''}${delta}</div>`:''}
    </div>`;
  }
  document.getElementById('paramEvolution').innerHTML = html;
}

function renderLog() {
  const lines = allData.rounds.map(r=>{
    const s=r.composite_score;
    const mark = s>=95?'EXCELLENT':s>=90?'GOOD':s>=85?'OK':'NEEDS_WORK';
    return `[Round ${r.round}] score=${s.toFixed(1)} | ${r.diagnosis||'unknown'} | ${mark}`;
  }).join('\n');
  document.getElementById('log').textContent = lines + 
    `\n\nBest Score: ${allData.bestScore?.toFixed(1)||'N/A'}` +
    `\nTotal Rounds: ${allData.rounds.length}` +
    `\n================================================================` +
    `\nView visualized matches in: data/visualization/` +
    `\nView detailed reports in: data/optimization/`;
}

function populateRoundSelect() {
  const sel = document.getElementById('roundSelect');
  sel.innerHTML = '<option value="-1">Latest</option>';
  allData.rounds.forEach((r,i)=> {
    sel.innerHTML += `<option value="${i}">Round ${r.round} (${r.composite_score?.toFixed(1)})</option>`;
  });
}

function showRound(idx) {
  if(idx==-1) { renderRoundMetrics(-1); return; }
  renderRoundMetrics(parseInt(idx));
  document.getElementById('matchImages').innerHTML = 
    `<img src="data/visualization/round_${String(allData.rounds[idx].round).padStart(3,'0')}_front.jpg" onerror="this.style.display='none'" alt="front">
     <img src="data/visualization/round_${String(allData.rounds[idx].round).padStart(3,'0')}_back.jpg" onerror="this.style.display='none'" alt="back">`;
}

async function runOptimization() {
  try {
    const resp = await fetch('/api/optimization/run', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_rounds:5,target_score:90,simulate:true})});
    const data = await resp.json();
    show(`Optimization complete! Best score: ${data.best_score?.toFixed(1)}`);
    loadData();
  } catch(e) {
    show('Using static data mode - no API server connected. Run: python self_optimize.py --simulate');
  }
}

function show(msg) {
  const el = document.getElementById('log');
  el.textContent = msg + '\n' + el.textContent;
}

loadData();
</script>
</body>
</html>
