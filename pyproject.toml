[project]
name = "battery-protection-designer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn>=0.51,<0.52",
  "opencv-contrib-python-headless>=5.0,<5.1",
  "python-multipart>=0.0.32,<0.1",
  "httpx>=0.28,<0.29",
  "PyYAML>=6.0,<7",
  "pydantic>=2.13,<3",
  "CairoSVG>=2.9,<3",
]

[project.scripts]
battery-designer = "battery_designer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
